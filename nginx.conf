server {
    listen 80;
    root /usr/share/nginx/html;
    # scans can be large; optimisation of a long OCR job takes minutes
    client_max_body_size 1g;

    # App lives under /pdf-sort/ (docker-gateway routes the prefix here unchanged)
    location = / {
        return 302 /pdf-sort/;
    }

    location /pdf-sort/ {
        try_files $uri /pdf-sort/index.html;
    }

    location /pdf-sort/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
